<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f6f1" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Carry" />
    <title>Carry</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      body{margin:0;background:#f8f6f1;color:#191714;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}.app-shell{min-height:100vh;max-width:720px;margin:0 auto;padding:18px 18px 110px}.topbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0 16px;background:#f8f6f1}h1{margin:0;font-size:2rem;line-height:1.05}.view-tabs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid #dfd9cf;border-radius:999px;background:#fffdfa}.tab-button{min-height:38px;border:0;border-radius:999px;background:transparent;color:#766f65;font-weight:700}.tab-button.active{background:#d8a900;color:#15120a}.icon-actions{display:flex;gap:8px}.icon-button{display:grid;width:42px;height:42px;place-items:center;border:1px solid #dfd9cf;border-radius:50%;background:#fffdfa}.view{display:none}.view.active{display:block}.empty-state{margin-top:18vh;color:#766f65;text-align:center}.empty-state h2{margin:0 0 8px;color:#191714;font-size:1.25rem}.empty-state p{max-width:310px;margin:0 auto;line-height:1.45}.quick-add{position:fixed;right:14px;bottom:calc(14px + var(--safe-bottom,0px) + var(--keyboard-offset,0px));left:14px;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) 50px;gap:8px;max-width:692px;margin:0 auto;padding:8px;border:1px solid #dfd9cf;border-radius:24px;background:#fffdfa;box-shadow:0 18px 50px rgba(49,43,31,.12)}.quick-add input{min-width:0;height:48px;border:0;outline:0;background:transparent;color:#191714;font-size:1.05rem}.quick-add button{width:50px;height:48px;border:0;border-radius:18px;background:#d8a900;color:#15120a;font-size:1.7rem;font-weight:700;line-height:1}
    </style>
    <link rel="stylesheet" href="styles.css?v=9" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <h1 id="dateLabel">Today</h1>
        <nav aria-label="App views" class="view-tabs">
          <button class="tab-button active" type="button" data-view="today">Today</button>
          <button class="tab-button" type="button" data-view="history">History</button>
        </nav>
        <div class="icon-actions">
          <button class="icon-button" id="sortButton" type="button" aria-label="Sort similar tasks" title="Sort similar tasks">
            <span aria-hidden="true">⇅</span>
          </button>
        </div>
      </header>

      <main>
        <section class="view active" id="todayView" aria-label="Today tasks">
          <div class="empty-state" id="emptyState">
            <h2>Nothing for today</h2>
            <p>Add a task when it comes up. Unfinished tasks carry into tomorrow automatically.</p>
          </div>
          <ul class="task-list" id="taskList" aria-label="Task list"></ul>
        </section>

        <section class="view" id="historyView" aria-label="Task history">
          <div class="history-list" id="historyList"></div>
        </section>
      </main>

      <form class="quick-add" id="taskForm" autocomplete="off">
        <input id="taskInput" name="task" type="text" enterkeyhint="done" placeholder="Add a task" aria-label="Add a task" />
        <button type="submit" aria-label="Add task">+</button>
      </form>
    </div>

    <script src="app.js?v=9" defer></script>
  </body>
</html>
